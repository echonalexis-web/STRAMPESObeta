<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcement Board — STRAM PESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1F7A34;
    --green-mid:#2E9C3F;
    --green-bright:#3CB54A;
    --yellow:#FFC72C;
    --yellow-soft:#FFE9A8;
    --cream:#FAFBF6;
    --ink:#1B2415;
    --gray:#6B7280;
    --line:#E7EBDF;
    --white:#FFFFFF;
    --shadow: 0 10px 24px rgba(31,122,52,0.10), 0 2px 6px rgba(31,122,52,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .board-wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 16px 60px;
  }

  /* ---- Header ---- */
  .board-header{margin-bottom:18px;}
  .board-title{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:26px;
    color:var(--green-deep);
    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
  }
  .board-title .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 0 4px var(--yellow-soft);
  }
  .board-sub{
    margin:4px 0 0;
    font-size:13.5px;
    color:var(--gray);
  }

  /* ---- Filter pills ---- */
  .filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:22px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:all .18s ease;
  }
  .pill:hover{border-color:var(--green-bright);}
  .pill.active{
    background:linear-gradient(135deg,var(--green-bright),var(--green-deep));
    border-color:transparent;
    color:var(--white);
  }

  /* ---- Card ---- */
  .card{
    background:var(--white);
    border-radius:18px;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    margin-bottom:22px;
    overflow:hidden;
  }
  .card.hidden{display:none;}

  .card-top{
    display:flex;
    align-items:center;
    gap:9px;
    padding:13px 16px;
  }
  .admin-badge{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--green-deep);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .admin-badge svg{width:13px;height:13px;}
  .posted-meta{flex:1; min-width:0;}
  .posted-by{
    font-weight:700;
    font-size:13.5px;
    color:var(--ink);
  }
  .posted-time{
    font-size:12px;
    color:var(--gray);
  }
  .cat-tag{
    font-family:'Baloo 2',sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.02em;
    padding:5px 11px;
    border-radius:8px;
    color:var(--green-deep);
    background:var(--yellow-soft);
    white-space:nowrap;
    flex:0 0 auto;
  }

  /* ---- Image + date flag + company logo (signature motif) ---- */
/* ---- Image + date flag + company logo (signature motif) ---- */
  .card-media {
    position: relative;
    width: 100%;
    /* Default rectangular aspect ratio */
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--green-mid);
    transition: aspect-ratio 0.2s ease;
  }

  /* Square aspect ratio applied dynamically via JS */
  .card-media.is-square {
    aspect-ratio: 1 / 1;
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .media-topbar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:0 16px;
  }
  .date-flag{
    background:var(--white);
    border-radius:0 0 10px 10px;
    padding:8px 12px 7px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }
  .date-flag .mon{
    display:block;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--white);
    background:var(--green-mid);
    margin:-8px -12px 3px;
    padding:2px 0 3px;
    border-radius:0;
  }
  .date-flag .day{
    display:block;
    font-family:'Baloo 2',sans-serif;
    font-size:19px;
    font-weight:800;
    color:var(--green-deep);
    line-height:1;
  }
  .company-logo{
    margin-top:10px;
    width:46px;height:46px;
    border-radius:50%;
    background:var(--white);
    border:3px solid var(--yellow);
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex:0 0 auto;
  }
  .company-logo img{width:100%;height:100%;object-fit:contain;padding:5px;}
  .media-cut{
    position:absolute;
    bottom:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 0 46px 62px;
    border-color:transparent transparent var(--yellow) transparent;
  }

  /* ---- Body ---- */
  .card-body{padding:16px;}
  .company-name{
    font-size:12.5px;
    font-weight:700;
    color:var(--green-deep);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:4px;
  }
  .card-headline{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:19px;
    margin:0 0 10px;
    color:var(--ink);
    line-height:1.25;
  }
  .info-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:10px;
  }
  .info-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--green-deep);
    font-weight:600;
  }
  .info-item svg{flex:0 0 auto;}
  .card-desc{
    font-size:14px;
    line-height:1.55;
    color:#3A4235;
    margin:0 0 4px;
  }
  .card-desc .more-link{
    color:var(--green-deep);
    font-weight:700;
    cursor:pointer;
    border:none;
    background:none;
    padding:0;
    font-size:14px;
    font-family:inherit;
  }
  .desc-full{display:none;}
  .desc-full.show{display:inline;}
  .desc-short.hide{display:none;}
  .card-body{padding-bottom:18px;}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--gray);
    font-size:14px;
    display:none;
  }
  .empty-state.show{display:block;}
</style>
</head>
<body>

<div class="board-wrap">
  <div class="board-header">
    <h1 class="board-title"><span class="dot"></span>Announcement Board</h1>
    <p class="board-sub">Official job fairs, trainings &amp; livelihood announcements</p>
  </div>

  <div class="filters" id="filters">
    <button class="pill active" data-filter="all">All</button>
    <button class="pill" data-filter="jobfair">Job Fairs</button>
    <button class="pill" data-filter="training">Trainings</button>
    <button class="pill" data-filter="seminar">Seminars</button>
    <button class="pill" data-filter="deadline">Deadlines</button>
  </div>

  <div id="board"></div>
  <div class="empty-state" id="emptyState">No announcements in this category yet — check back soon.</div>
</div>

<script>
    
let POSTS = JSON.parse(localStorage.getItem('stram_posts'));

if(!POSTS || POSTS.length === 0) {
  POSTS = [
    {
      id: 1,
      category: "jobfair",
      catLabel: "Job Fair",
      company: "LMD PESO Marinduque",
      logo: "https://api.dicebear.com/7.x/initials/svg?seed=PESO&backgroundColor=1F7A34&textColor=ffffff",
      img: "../images/BOOKEEPER.png",
      postedTime: "Posted 2h ago",
      month: "SEP",
      day: "05",
      title: "Marinduque Mega Job Fair 2026",
      location: "Boac Gymnasium",
      time: "8:00 AM – 4:00 PM",
      slots: "40+ employers",
      descShort: "Over 40 companies hiring on-site — bring 5 copies of your resume, valid ID, and be ready for walk-in interviews.",
      descFull: "Over 40 companies hiring on-site — bring 5 copies of your resume, valid ID, and be ready for walk-in interviews. Openings span retail, BPO, manufacturing, and government casual positions. Free shuttle service from the town plaza runs every 30 minutes starting 7:00 AM."
    },
    {
      id: 2,
      category: "training",
      catLabel: "Skills Training",
      company: "GoodChow Culinary Hub",
      logo: "https://api.dicebear.com/7.x/initials/svg?seed=GC&backgroundColor=FFC72C&textColor=1F7A34",
      img: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=900&q=80",
      postedTime: "Posted 5h ago",
      month: "SEP",
      day: "12",
      title: "Free Culinary Arts Livelihood Training",
      location: "GoodChow Training Center, Sta. Cruz",
      time: "9:00 AM – 12:00 PM (5 sessions)",
      slots: "30 slots left",
      descShort: "Learn basic to intermediate cooking skills with a certificate of completion — ideal for aspiring food stall owners.",
      descFull: "Learn basic to intermediate cooking skills with a certificate of completion — ideal for aspiring food stall owners or those seeking kitchen staff positions. Includes food safety certification, knife skills, and a mini business-planning module for starting your own food cart."
    },
    {
      id: 3,
      category: "seminar",
      catLabel: "Seminar",
      company: "DTI Marinduque",
      logo: "https://api.dicebear.com/7.x/initials/svg?seed=DTI&backgroundColor=1F7A34&textColor=ffffff",
      img: "https://images.unsplash.com/photo-1591115765373-5207764f72e7?w=900&q=80",
      postedTime: "Posted 1d ago",
      month: "SEP",
      day: "18",
      title: "Livelihood Seed Capital Orientation",
      location: "DTI Provincial Office",
      time: "1:00 PM – 3:00 PM",
      slots: "Open to all residents",
      descShort: "Learn how to apply for DTI's negosyo seed capital assistance and required documents for micro-enterprise applicants.",
      descFull: "Learn how to apply for DTI's negosyo seed capital assistance and the required documents for micro-enterprise applicants. DTI staff will walk through the application form, eligibility checklist, and answer questions on fund release timelines for approved livelihood proposals."
    },
    {
      id: 4,
      category: "jobfair",
      catLabel: "Job Fair",
      company: "Motortrade Careers",
      logo: "https://api.dicebear.com/7.x/initials/svg?seed=MT&backgroundColor=FFC72C&textColor=1F7A34",
      img: "https://images.unsplash.com/photo-1560250097-0b93528c311a?w=900&q=80",
      postedTime: "Posted 1d ago",
      month: "SEP",
      day: "22",
      title: "Motortrade Direct Hiring Day",
      location: "Motortrade Branch, Boac",
      time: "9:00 AM – 5:00 PM",
      slots: "15 positions",
      descShort: "On-the-spot hiring for sales associates, cashiers, and mechanics — same-day job offers for qualified applicants.",
      descFull: "On-the-spot hiring for sales associates, cashiers, and mechanics — same-day job offers for qualified applicants. High school graduates welcome to apply for entry-level roles; technical positions require at least 1 year of relevant experience or a TESDA certificate."
    },
    {
      id: 5,
      category: "deadline",
      catLabel: "Deadline",
      company: "LMD PESO Marinduque",
      logo: "https://api.dicebear.com/7.x/initials/svg?seed=PESO2&backgroundColor=1F7A34&textColor=ffffff",
      img: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=900&q=80",
      postedTime: "Posted 2d ago",
      month: "AUG",
      day: "30",
      title: "Emergency Employment Program — Last Call",
      location: "Submit at PESO Office",
      time: "Deadline 5:00 PM sharp",
      slots: "Limited slots",
      descShort: "Final day to submit applications for the province's 10-day Emergency Employment cash-for-work program.",
      descFull: "Final day to submit applications for the province's 10-day Emergency Employment cash-for-work program. Priority is given to displaced workers and heads of households. Bring barangay certificate of indigency, valid ID, and a completed application form available at the PESO front desk."
    }
  ];
}

const boardEl = document.getElementById('board');
const emptyState = document.getElementById('emptyState');
let activeFilter = 'all';

function cardTemplate(post){
  return `
  <article class="card" data-category="${post.category}" id="card-${post.id}">
    <div class="card-top">
      <div class="admin-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4"><path d="M12 2l8 4v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6l8-4z"/></svg>
      </div>
      <div class="posted-meta">
        <div class="posted-by">Posted by Admin</div>
        <div class="posted-time">${post.postedTime}</div>
      </div>
      <div class="cat-tag">${post.catLabel}</div>
    </div>

    <!-- Added onload attribute to trigger dimension check -->
    <div class="card-media">
      <img src="${post.img}" alt="${post.title}" loading="lazy" onload="detectAspectRatio(this)">
      <div class="media-topbar">
        <div class="date-flag"><span class="mon">${post.month}</span><span class="day">${post.day}</span></div>
        <div class="company-logo"><img src="${post.logo}" alt="${post.company} logo"></div>
      </div>
      <div class="media-cut"></div>
    </div>

    <div class="card-body">
      <div class="company-name">${post.company}</div>
      <h2 class="card-headline">${post.title}</h2>
      <div class="info-row">
        <div class="info-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
          ${post.location}
        </div>
        <div class="info-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          ${post.time}
        </div>
        <div class="info-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="10" cy="7" r="4"/></svg>
          ${post.slots}
        </div>
      </div>
      <p class="card-desc">
        <span class="desc-short">${post.descShort} <button class="more-link" onclick="toggleDesc(${post.id})">See more</button></span>
        <span class="desc-full">${post.descFull} <button class="more-link" onclick="toggleDesc(${post.id})">See less</button></span>
      </p>
    </div>
  </article>`;
}

/* Function to automatically check image dimensions */
function detectAspectRatio(imgEl) {
  const width = imgEl.naturalWidth;
  const height = imgEl.naturalHeight;
  
  if (width && height) {
    const parentMedia = imgEl.closest('.card-media');
    // If the difference between width and height is small (square image), set square aspect ratio
    if (Math.abs(width - height) / Math.max(width, height) < 0.05) {
      parentMedia.classList.add('is-square');
    } else {
      parentMedia.classList.remove('is-square');
    }
  }
}


function renderBoard(){
  boardEl.innerHTML = POSTS.map(cardTemplate).join('');
  applyFilter();
}

function applyFilter(){
  let visibleCount = 0;
  POSTS.forEach(p => {
    const el = document.getElementById('card-'+p.id);
    const match = activeFilter === 'all' || p.category === activeFilter;
    el.classList.toggle('hidden', !match);
    if(match) visibleCount++;
  });
  emptyState.classList.toggle('show', visibleCount === 0);
}

document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('.pill');
  if(!btn) return;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  applyFilter();
});

function toggleDesc(id){
  const card = document.getElementById('card-'+id);
  card.querySelector('.desc-short').classList.toggle('hide');
  card.querySelector('.desc-full').classList.toggle('show');
}

renderBoard();
</script>

</body>
</html>
